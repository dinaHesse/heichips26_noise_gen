# LibreLane configuration file

meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

DESIGN_NAME: heichips26_digital_project
VERILOG_FILES: dir::../../rtl/*.sv
CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 10 # 10ns = 100MHz

# SDC files
PNR_SDC_FILE: dir::impl.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

# Reduce wasted space
TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 6
RIGHT_MARGIN_MULT: 6

# Absolute die size
FP_SIZING: absolute

# Tiny DEF template
#DIE_AREA: [0, 0, 200, 200]
#FP_DEF_TEMPLATE: dir::heichips26_template_tiny.def

# Small DEF template
DIE_AREA: [0, 0, 500, 200]
FP_DEF_TEMPLATE: dir::heichips26_template_small.def

# Large DEF template
#DIE_AREA: [0, 0, 500, 415]
#FP_DEF_TEMPLATE: dir::heichips26_template_large.def

# Don't use power rings or TopMetal1 layer
PDN_MULTILAYER: false
RT_MAX_LAYER: Metal4
PDN_VERTICAL_LAYER: Metal4
PDN_HORIZONTAL_LAYER: Metal3

# Enable for better SystemVerilog support
#USE_SLANG: true

